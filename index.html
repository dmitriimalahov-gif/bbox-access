<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>B’BOX — вход</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f4;color:#18392f;font:16px system-ui,sans-serif;padding:24px}main{width:min(100%,440px);padding:40px;background:white;border:1px solid #dce6df;border-radius:20px;box-shadow:0 16px 60px #193b2910}h1{font-size:32px;letter-spacing:-1px;margin:0 0 24px}p{line-height:1.6;color:#52665c}button{background:#17654b;color:white;border:0;border-radius:10px;padding:13px 18px;font:inherit;cursor:pointer}small{display:block;color:#74867c;margin-top:24px;line-height:1.5}
</style>
<main><h1>B’BOX</h1><p id="message" role="status">Подключаемся к рабочей базе…</p><button id="retry" hidden>Повторить</button><small>Заказы · материалы · производство · техзадания</small></main>
<script>
const accessFragment = location.hash;
// Keep the invitation key out of history and HTTP referrers.
history.replaceState(null, '', location.pathname);
const message = document.getElementById('message');
const retry = document.getElementById('retry');
async function connect() {
  retry.hidden = true;
  message.textContent = 'Подключаемся к рабочей базе…';
  try {
    const response = await fetch('https://raw.githubusercontent.com/dmitriimalahov-gif/bbox-access/main/target.json?t=' + Date.now(), { cache: 'no-store', referrerPolicy: 'no-referrer', signal: AbortSignal.timeout(15000) });
    if (!response.ok) throw new Error('Connection unavailable');
    const { url } = await response.json();
    if (typeof url !== 'string' || !/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url)) throw new Error('Invalid connection');
    location.replace(url.replace(/\/$/, '') + '/' + accessFragment);
  } catch (error) {
    message.textContent = 'Пока не удалось подключиться. Проверьте интернет и повторите попытку. Рабочий Mac должен быть включён.';
    retry.hidden = false;
  }
}
retry.addEventListener('click', connect);
connect();
</script>
</html>
